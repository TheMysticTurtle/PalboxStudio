[package]
name = "palbox-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Palbox Studio headless engine: Palworld 1.0 Global Pal box model, load/write, and mutations. No UI."

[dependencies]
# Palworld .sav decode/encode: Oodle decompression + GVAS, via oMaN-Rod's uesave
# fork (the one PSP uses). Pinned to PSP's known-good commit for reproducibility.
uesave = { git = "https://github.com/oMaN-Rod/uesave-rs.git", rev = "a5271781df0ed021d72e5ad6eab1c59d5199451c", features = ["oodle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
